<!DOCTYPE html>
<html>

<head>

  <title>Home Ownership Rate by State 2025</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.0/dist/leaflet.css" />

  <style>
    html {
      height: 100%;
    }

    body {
      height: 100%;
      padding: 0;
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .box {
      background: #ffffff;
      color: #000000;
      padding: 8px 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    }

    #title {
      position: absolute;
      top: 15px;
      left: 55px;
      width: 300px;
      z-index: 1000;
    }

    #title h1 {
      margin: 0;
      font-size: 24px;
      color: #3f8a52;
    }

    #legend {
      position: absolute;
      bottom: 30px;
      right: 10px;
      z-index: 1000;
    }

    .legend h4 {
      margin: 0 0 6px 0;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #3f8a52;
    }

    .credit {
      font-size: 12px;
      line-height: 1.4;
    }

    .legend div {
      line-height: 22px;
      font-size: 13px;
    }

    .legend i {
      display: inline-block;
      width: 22px;
      height: 14px;
      margin-right: 8px;
      vertical-align: middle;
      border: 1px solid #888;
    }

    /* popup that follows the mouse over a state */
    .leaflet-tooltip {
      background: #ffffff;
      color: #000000;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: normal;
      padding: 6px 9px;
      border: none;
      border-radius: 0;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    }

    .leaflet-tooltip:before {
      display: none;
    }
  </style>

  <script src="https://unpkg.com/leaflet@1.7.0/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/1.3.4/chroma.min.js"></script>

</head>

<body>

  <div id='map'></div>

  <div id="title" class="box">
    <h1>Home Ownership Rate by State 2025</h1>
  </div>

  <div id="legend" class="legend box">
    <h4>Homeownership Rate</h4>
    <div><i style="background:#f4edc9"></i>40 &ndash; 52%</div>
    <div><i style="background:#ced8b3"></i>52 &ndash; 60%</div>
    <div><i style="background:#a7c49c"></i>60 &ndash; 67%</div>
    <div><i style="background:#80af86"></i>67 &ndash; 72%</div>
    <div><i style="background:#5a9a70"></i>72%+</div>
  </div>

  <script>
    // map object and basemap
    var map = L.map('map', {
      zoomSnap: 0.25
    });
    map.fitBounds([
      [18, -170],
      [72, -66]
    ]);
    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 16
      }).addTo(map);

    // colors and classifications (natural breaks)
    var grades = [40, 52, 60, 67, 72];
    var colors = chroma.scale(['#f4edc9', '#5a9a70']).colors(grades.length);

    function getColor(d) {
      // Puerto Rico has no rate (stored as 0), so show it in gray
      if (!d) return '#cccccc';
      for (var i = grades.length - 1; i >= 0; i--) {
        if (d >= grades[i]) return colors[i];
      }
    }

    function style(feature) {
      return {
        weight: 1.5,
        opacity: 1,
        color: '#3a3c40',
        fillOpacity: 0.85,
        fillColor: getColor(feature.properties.Homeowners)
      };
    }

    var geojson = null;

    // hover click and mouseout
    function highlightFeature(e) {
      var layer = e.target;
      layer.setStyle({
        weight: 3,
        color: '#3a3c40'
      });
      layer.bringToFront();
    }

    function resetHighlight(e) {
      geojson.resetStyle(e.target);
    }

    function zoomToFeature(e) {
      map.fitBounds(e.target.getBounds());
    }

    function onEachFeature(feature, layer) {
      // shows the state name and homeownership rate in a popup next to the mouse
      var rate = feature.properties.Homeowners ? feature.properties.Homeowners + '%' : 'No data';
      layer.bindTooltip(feature.properties.NAME + '<br>Homeownership Rate: ' + rate, {
        sticky: true
      });
      layer.on({
        mouseover: highlightFeature,
        click: zoomToFeature,
        mouseout: resetHighlight
      });
    }

    geojson = L.geoJson.ajax("assets/homeownership_rate_by_state.geojson", {
      style: style,
      onEachFeature: onEachFeature
    }).addTo(map);

    // credits in the bottom left
    var credit = L.control({
      position: 'bottomleft'
    });

    credit.onAdd = function (map) {
      var div = L.DomUtil.create('div', 'credit box');
      div.innerHTML = 'Data: U.S. Census Bureau, Homeownership Rates for 2025<br>Map by Blythe Crady';
      return div;
    };

    credit.addTo(map);
  </script>

</body>

</html>
